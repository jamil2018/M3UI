name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit --audit-level=low

      - name: Lint, typecheck, unit and accessibility tests
        run: pnpm check

      - name: Build docs, Storybook, and packages
        run: pnpm build

      - name: Spec, parity, and bundle gates
        run: pnpm parity:gates
        env:
          SPEC_PARITY_STRICT: '1'

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Visual and interaction tests
        run: pnpm exec playwright test

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
