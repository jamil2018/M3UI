name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: A11y tests
        run: pnpm test:a11y

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: VRT
        run: pnpm test:vrt

      - name: Registry import check
        run: pnpm --filter @m3ui/react test:registry

      # Material Web parity gates (see docs/PARITY-SYNC.md)
      - name: Spec sync check
        run: pnpm spec:sync:check

      - name: Parity report check
        run: SPEC_PARITY_STRICT=1 pnpm parity:check

      - name: Token coverage gate
        run: pnpm --filter @m3ui/react test:coverage

      - name: Bundle size budgets
        run: pnpm size:check

      - name: RSC boundary audit
        run: pnpm --filter @m3ui/react test:rsc

      - name: Reduced motion coverage
        run: pnpm --filter @m3ui/react test:motion

      - name: Docs completeness gate
        run: pnpm --filter @m3ui/react test:docs
