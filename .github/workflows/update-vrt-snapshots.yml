name: Update VRT snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Update VRT snapshots
        run: pnpm test:vrt -- --update-snapshots
        continue-on-error: true

      - name: Create pull request with updated snapshots
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(vrt): re-baseline snapshots on Linux CI'
          branch: chore/vrt-linux-snapshots
          title: 'chore(vrt): re-baseline snapshots on Linux CI'
          body: |
            Auto-generated by the Update VRT snapshots workflow on ubuntu-latest.
            Re-baselines Playwright screenshots after parity changes and CI webServer fixes.
          delete-branch: true
